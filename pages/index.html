<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Reach a Ballet Photophonique controller over USB or the network: TesserUI's launcher." />
    <title>Ballet Photophonique</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <!-- TesserUI's bundle, published by .github/workflows/release.yml with the
         firmware it serves. A launcher: it opens ?api=, or the controller the
         user picks (TesserUI's DESIGN.md section 9.7). -->
    <script>
      // midi.js and recorder.js: the MIDI keyboard and the recorder's
      // elements, from this page's origin, since an HTTPS page can't load
      // them from a controller's http:// address.
      window.TESSER = { launcher: true, title: 'Ballet Photophonique', scripts: ['midi.js', 'recorder.js'] };
    </script>
    <script src="ui.js"></script>
  </body>
</html>
