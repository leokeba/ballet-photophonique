# Each push to main: the host tests, then a release of the firmware under the
# next patch version (ballet-photophonique-esp32.bin, the image the controllers
# install from /sys/firmware/github, and ballet-photophonique-esp32-factory.bin,
# the whole flash for a new board), built by TesserKIT's firmware.yml against
# the sibling commits deps.lock pins (scripts/pin.sh); and TesserUI's launcher
# on GitHub Pages (https://leokeba.github.io/ballet-photophonique/), built from
# the same TesserUI, with the latest releases' images for its flasher. A commit
# message with "[skip ci]" releases nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, so two pushes never take the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      # The repository and the libraries side by side, as on a developer's
      # machine, the libraries at deps.lock's commits.
      - uses: actions/checkout@v5
        with:
          path: ballet-photophonique
      - name: Check out the libraries
        run: |
          for dep in $(sed 's/#.*//' ballet-photophonique/deps.lock); do
            repo=${dep%@*}
            sha=${dep#*@}
            dir=${repo#*/}
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "https://github.com/$repo" "$sha"
            git -C "$dir" checkout -q FETCH_HEAD
            echo "$repo $(git -C "$dir" rev-parse --short HEAD)"
          done
      - name: Build and run tests (ASan + UBSan)
        working-directory: ballet-photophonique
        run: |
          cmake -S . -B build
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  firmware:
    needs: host-tests
    permissions:
      contents: write
    uses: leokeba/TesserKIT/.github/workflows/firmware.yml@main
    with:
      project: firmware
      name: ballet-photophonique
      dependencies-file: deps.lock

  # TesserUI's bridge as a macOS executable for each architecture
  # (ballet-photophonique-bridge-macos-arm64.zip, -x64.zip), attached to the
  # release: it finds the controllers nearby and serves this launcher from
  # localhost, with the flasher built in and the releases' images fetched from
  # GitHub (TesserUI's DESIGN.md section 9.7), and the keyboard and the
  # recorder beside its page. The launcher links to the latest release's, so
  # they are missing there until this job is done.
  bridge:
    needs: firmware
    permissions:
      contents: write
    uses: leokeba/TesserUI/.github/workflows/bridge.yml@main
    with:
      page: pages/index.html
      name: ballet-photophonique-bridge
      tag: v${{ needs.firmware.outputs.version }}
      files: |
        web/elements/midi.js
        web/elements/recorder.js
      tesserui-ref: ${{ fromJSON(needs.firmware.outputs.dependencies)['leokeba/TesserUI'] }}

  # The launcher (TesserUI's DESIGN.md section 9.7): the controllers reached
  # over USB or the network, with no interface of their own needed, and a new
  # board installed over USB. Deployed even when the release failed, with the
  # releases there are.
  pages:
    needs: [host-tests, firmware]
    if: ${{ !cancelled() && needs.host-tests.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - id: pins
        run: echo "tesserui=$(sed -n 's|^leokeba/TesserUI@||p' deps.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: leokeba/TesserUI
          ref: ${{ steps.pins.outputs.tesserui }}
          path: TesserUI
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: TesserUI/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: TesserUI/web/pnpm-lock.yaml
      - name: Build the bundle
        working-directory: TesserUI/web
        run: pnpm install --frozen-lockfile && pnpm build
      # ui.js loads the launcher's workspace (several controllers at once)
      # from launcher.js beside it, and the flasher from flash/.
      - name: Site
        run: mkdir _site && cp pages/index.html TesserUI/web/dist/ui.js TesserUI/web/dist/launcher.js web/elements/midi.js web/elements/recorder.js _site/ && cp -R TesserUI/web/dist/flash _site/flash
      # A page can't read release assets from GitHub (no CORS): the flasher
      # finds them next to it.
      - name: The firmware the launcher installs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node TesserUI/web/scripts/firmware.mjs "$GITHUB_REPOSITORY" _site/firmware --releases 3
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
